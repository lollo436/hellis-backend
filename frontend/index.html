<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hellis AI - Mente Alveare</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #ffffff;
            color: #0f172a;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        .sidebar {
            width: 260px;
            background-color: #f9fafb;
            display: flex;
            flex-direction: column;
            padding: 10px;
            border-right: 1px solid #e5e7eb;
        }
        .new-chat-btn {
            background: transparent;
            color: #0f172a;
            border: 1px solid #d1d5db;
            padding: 10px;
            border-radius: 12px;
            text-align: left;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            transition: background 0.2s;
        }
        .new-chat-btn:hover {
            background-color: #f3f4f6;
        }
        .sidebar-history {
            flex-grow: 1;
            overflow-y: auto;
            font-size: 13px;
            color: #4b5563;
            padding: 5px 0;
        }
        .history-item {
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
            color: #1f2937;
        }
        .history-item:hover {
            background-color: #f3f4f6;
        }
        .sidebar-footer {
            border-top: 1px solid #e5e7eb;
            padding-top: 10px;
            font-size: 13px;
            color: #4b5563;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: relative;
            background-color: #ffffff;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid #e5e7eb;
            background-color: #ffffff;
        }
        .model-title {
            font-weight: 600;
            font-size: 16px;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-call {
            background-color: #10a37f;
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }
        .btn-call:hover {
            background-color: #0e906f;
        }
        #statoVoce {
            font-size: 12px;
            color: #059669;
            margin-left: 10px;
            font-weight: 500;
        }
        .chat-container {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 120px;
        }
        .welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            gap: 20px;
        }
        .welcome-screen h2 {
            font-size: 32px;
            font-weight: 700;
            color: #0f172a;
        }
        .message-row {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .message-row.ai {
            background-color: #f8fafc;
        }
        .message-content {
            width: 100%;
            max-width: 768px;
            display: flex;
            gap: 16px;
            font-size: 15px;
            line-height: 1.6;
            color: #0f172a;
            background: #ffffff;
            padding: 16px;
            border-radius: 18px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }
        .message-row.ai .message-content {
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
        }
        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 12px;
            flex-shrink: 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .avatar.user {
            background-color: #6366f1;
            color: white;
        }
        .avatar.ai {
            background-color: #10a37f;
            color: white;
        }
        .text {
            flex-grow: 1;
            white-space: pre-wrap;
            word-break: break-word;
            color: #0f172a;
        }
        
        /* Animazione di scrittura / pensiero della mente alveare */
        .typing-row {
            width: 100%;
            display: none;
            justify-content: center;
            padding: 20px;
            background-color: #f8fafc;
        }
        .typing-content {
            width: 100%;
            max-width: 768px;
            display: flex;
            gap: 16px;
            align-items: center;
            font-size: 15px;
            color: #64748b;
            background: #f1f5f9;
            padding: 16px;
            border-radius: 18px;
            border: 1px solid #e2e8f0;
        }
        .typing-dots {
            display: flex;
            gap: 4px;
            align-items: center;
        }
        .typing-dots span {
            width: 8px;
            height: 8px;
            background-color: #10a37f;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
        .typing-dots span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        .input-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.95) 50%, #ffffff 100%);
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .input-box-wrapper {
            width: 100%;
            max-width: 768px;
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 24px;
            padding: 10px 16px;
            display: flex;
            align-items: flex-end;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        textarea {
            flex-grow: 1;
            background: transparent;
            border: none;
            color: #0f172a;
            font-size: 15px;
            resize: none;
            outline: none;
            max-height: 200px;
            line-height: 1.4;
            padding-bottom: 4px;
        }
        textarea::placeholder {
            color: #94a3b8;
        }
        .attach-btn {
            background: transparent;
            border: none;
            color: #64748b;
            cursor: pointer;
            font-size: 20px;
            padding: 4px 8px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s, background 0.2s;
        }
        .attach-btn:hover {
            color: #0f172a;
            background-color: #f1f5f9;
        }
        .send-btn {
            background-color: #0f172a;
            color: #ffffff;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            transition: background 0.2s;
            flex-shrink: 0;
        }
        .send-btn:hover {
            background-color: #334155;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <button class="new-chat-btn" onclick="nuovaChat()">+ Nuova chat</button>
        <div class="sidebar-history" id="sidebarHistory"></div>
        <div class="sidebar-footer">
            <div class="avatar user" style="width: 24px; height: 24px; font-size: 10px;">L</div>
            <span>Lorenzo (Signore)</span>
        </div>
    </div>

    <div class="main-content">
        <div class="top-bar">
            <div class="model-title">
                Hellis AI (Mente Alveare) <span style="color: #64748b; font-weight: normal; font-size: 14px;">▼</span>
                <span id="statoVoce"></span>
            </div>
            <button class="btn-call" onclick="avviaChiamata()">
                📞 Avvia Chiamata Vocale
            </button>
        </div>

        <div id="chatContainer" class="chat-container">
            <div class="welcome-screen" id="welcomeScreen">
                <h2>Come posso aiutarti, Signore?</h2>
            </div>
        </div>

        <!-- Indicatore di elaborazione / pensiero della mente alveare -->
        <div id="typingRow" class="typing-row">
            <div class="typing-content">
                <div class="avatar ai">H</div>
                <div class="typing-dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <span style="font-style: italic; color: #64748b;">La mente alveare sta elaborando...</span>
            </div>
        </div>

        <div class="input-container">
            <div class="input-box-wrapper">
                <input type="file" id="fileInput" style="display: none;" onchange="gestisciFile(this)">
                <button class="attach-btn" onclick="document.getElementById('fileInput').click()" title="Allega foto o documento">📎</button>
                
                <textarea id="userInput" rows="1" placeholder="Invia un messaggio a Hellis AI..." onkeydown="handleKeyDown(event)"></textarea>
                <button class="send-btn" onclick="inviaMessaggio()">↑</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://hellis-backend1.onrender.com";
        let chatIniziata = false;
        let cronologiaChat = JSON.parse(localStorage.getItem("hellis_cronologia")) || [];

        const textareaEl = document.getElementById("userInput");
        textareaEl.addEventListener("input", function() {
            this.style.height = "auto";
            this.style.height = (this.scrollHeight) + "px";
        });

        function aggiornaSidebar() {
            const historyDiv = document.getElementById("sidebarHistory");
            historyDiv.innerHTML = "";
            cronologiaChat.forEach((chat, index) => {
                const item = document.createElement("div");
                item.className = "history-item";
                item.innerText = chat.titolo;
                item.onclick = () => caricaChat(index);
                historyDiv.appendChild(item);
            });
        }

        function nuovaChat() {
            chatIniziata = false;
            const container = document.getElementById("chatContainer");
            container.innerHTML = `
                <div class="welcome-screen" id="welcomeScreen">
                    <h2>Come posso aiutarti, Signore?</h2>
                </div>
            `;
            mostraAnimazioneScrittura(false);
        }

        function mostraAnimazioneScrittura(mostra) {
            const typingRow = document.getElementById("typingRow");
            const container = document.getElementById("chatContainer");
            typingRow.style.display = mostra ? "flex" : "none";
            if (mostra) {
                container.scrollTop = container.scrollHeight;
            }
        }

        function aggiungiMessaggio(testo, mittente) {
            const container = document.getElementById("chatContainer");
            const welcome = document.getElementById("welcomeScreen");
            if (welcome) {
                welcome.remove();
                chatIniziata = true;
            }

            const row = document.createElement("div");
            row.className = `message-row ${mittente}`;

            const content = document.createElement("div");
            content.className = "message-content";

            const avatar = document.createElement("div");
            avatar.className = `avatar ${mittente}`;
            avatar.innerText = mittente === "user" ? "L" : "H";

            const textDiv = document.createElement("div");
            textDiv.className = "text";
            textDiv.innerText = testo;

            content.appendChild(avatar);
            content.appendChild(textDiv);
            row.appendChild(content);
            container.appendChild(row);
            container.scrollTop = container.scrollHeight;
        }

        function salvaInCronologia(primoMessaggio) {
            if (cronologiaChat.length === 0 || cronologiaChat[0].titolo !== primoMessaggio) {
                cronologiaChat.unshift({ titolo: primoMessaggio, data: new Date().toISOString() });
                localStorage.setItem("hellis_cronologia", JSON.stringify(cronologiaChat));
                aggiornaSidebar();
            }
        }

        function gestisciFile(input) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                aggiungiMessaggio(`[File allegato: ${file.name}]`, "user");
                salvaInCronologia(`Allegato: ${file.name}`);
                inviaFileAlServer(file);
            }
        }

        async function inviaFileAlServer(file) {
            const formData = new FormData();
            formData.append("file", file);
            mostraAnimazioneScrittura(true);

            try {
                const res = await fetch(`${API_URL}/api/v1/audio/upload`, {
                    method: "POST",
                    body: formData
                });
                const data = await res.json();
                mostraAnimazioneScrittura(false);
                if (data.message) {
                    aggiungiMessaggio(data.message, "ai");
                }
            } catch (err) {
                mostraAnimazioneScrittura(false);
                aggiungiMessaggio("Errore di sincronizzazione con l'alveare, Signore.", "ai");
            }
        }

        function parlaTesto(testo) {
            if ("speechSynthesis" in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(testo);
                utterance.lang = "it-IT";
                utterance.rate = 1.0;
                
                const voci = window.speechSynthesis.getVoices();
                const voceItaliana = voci.find(v => v.lang.includes("it") || v.lang.includes("IT"));
                if (voceItaliana) {
                    utterance.voice = voceItaliana;
                }

                window.speechSynthesis.speak(utterance);
            }
        }

        if ("speechSynthesis" in window) {
            window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
        }

        function avviaChiamata() {
            const statoEl = document.getElementById("statoVoce");
            if (!("webkitSpeechRecognition" in window) && !("SpeechRecognition" in window)) {
                alert("Il browser non supporta il riconoscimento vocale.");
                return;
            }

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = "it-IT";
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = function() {
                statoEl.innerText = "• In ascolto...";
                parlaTesto("Linea aperta, Signore. Vi ascolto.");
            };

            recognition.onresult = function(event) {
                const testoUtente = event.results[0][0].transcript;
                statoEl.innerText = "• Elaborazione...";
                salvaInCronologia(testoUtente);
                aggiungiMessaggio(testoUtente, "user");
                inviaAlServer(testoUtente, true);
            };

            recognition.onerror = function() {
                statoEl.innerText = "• Errore voce";
            };

            recognition.onend = function() {
                setTimeout(() => {
                    if (statoEl.innerText.includes("In ascolto")) {
                        statoEl.innerText = "";
                    }
                }, 2000);
            };

            try {
                recognition.start();
            } catch (e) {
                console.error(e);
            }
        }

        async function inviaMessaggio() {
            const textarea = document.getElementById("userInput");
            const testo = textarea.value.trim();
            if (!testo) return;

            if (!chatIniziata) {
                salvaInCronologia(testo);
            }

            aggiungiMessaggio(testo, "user");
            textarea.value = "";
            textarea.style.height = "auto";
            await inviaAlServer(testo, false);
        }

        function handleKeyDown(e) {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                inviaMessaggio();
            }
        }

        async function inviaAlServer(testo, vocale) {
            const statoEl = document.getElementById("statoVoce");
            mostraAnimazioneScrittura(true);
            try {
                const res = await fetch(`${API_URL}/api/v1/chat/privata`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: testo })
                });
                const data = await res.json();
                mostraAnimazioneScrittura(false);
                if (data.response) {
                    aggiungiMessaggio(data.response, "ai");
                    if (vocale) {
                        statoEl.innerText = "";
                        parlaTesto(data.response);
                    }
                }
            } catch (err) {
                mostraAnimazioneScrittura(false);
                const errMsg = "Errore di connessione alla mente alveare.";
                aggiungiMessaggio(errMsg, "ai");
                if (vocale) parlaTesto(errMsg);
            }
        }

        aggiornaSidebar();
    </script>
</body>
</html>
