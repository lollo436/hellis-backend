<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hellis AI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #212121;
            color: #ececec;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        /* Sidebar in stile ChatGPT */
        .sidebar {
            width: 260px;
            background-color: #171717;
            display: flex;
            flex-direction: column;
            padding: 10px;
            border-right: 1px solid #2f2f2f;
        }
        .new-chat-btn {
            background: transparent;
            color: #ececec;
            border: 1px solid #424242;
            padding: 10px;
            border-radius: 6px;
            text-align: left;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            transition: background 0.2s;
        }
        .new-chat-btn:hover {
            background-color: #212121;
        }
        .sidebar-history {
            flex-grow: 1;
            overflow-y: auto;
            font-size: 13px;
            color: #b4b4b4;
            padding: 5px 0;
        }
        .sidebar-history div {
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .sidebar-history div:hover {
            background-color: #212121;
            color: #ececec;
        }
        .sidebar-footer {
            border-top: 1px solid #2f2f2f;
            padding-top: 10px;
            font-size: 13px;
            color: #8e8ea0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Area Principale Chat */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: relative;
            background-color: #212121;
        }

        /* Top bar con pulsante chiamata */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid #2f2f2f;
            background-color: #212121;
        }
        .model-title {
            font-weight: 600;
            font-size: 16px;
            color: #ececec;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-call {
            background-color: #10a37f;
            color: #fff;
            border: none;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }
        .btn-call:hover {
            background-color: #0e906f;
        }
        #statoVoce {
            font-size: 12px;
            color: #10a37f;
            margin-left: 10px;
        }

        /* Contenitore messaggi */
        .chat-container {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 120px;
        }
        .message-row {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 24px 20px;
            border-bottom: 1px solid transparent;
        }
        .message-row.ai {
            background-color: #2f2f2f;
            border-bottom: 1px solid #262626;
            border-top: 1px solid #262626;
        }
        .message-content {
            width: 100%;
            max-width: 768px;
            display: flex;
            gap: 16px;
            font-size: 15px;
            line-height: 1.6;
        }
        .avatar {
            width: 30px;
            height: 30px;
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 12px;
            flex-shrink: 0;
        }
        .avatar.user {
            background-color: #5436da;
            color: white;
        }
        .avatar.ai {
            background-color: #10a37f;
            color: white;
        }
        .text {
            flex-grow: 1;
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* Area Input fissa in basso */
        .input-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(180deg, rgba(33,33,33,0) 0%, rgba(33,33,33,0.9) 50%, #212121 100%);
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .input-box-wrapper {
            width: 100%;
            max-width: 768px;
            background-color: #2f2f2f;
            border: 1px solid #424242;
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            align-items: flex-end;
            gap: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }
        textarea {
            flex-grow: 1;
            background: transparent;
            border: none;
            color: #ececec;
            font-size: 15px;
            resize: none;
            outline: none;
            max-height: 200px;
            line-height: 1.4;
        }
        textarea::placeholder {
            color: #8e8ea0;
        }
        .send-btn {
            background-color: #ececec;
            color: #212121;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            transition: background 0.2s;
            flex-shrink: 0;
        }
        .send-btn:hover {
            background-color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <button class="new-chat-btn" onclick="location.reload()">+ Nuova chat</button>
        <div class="sidebar-history">
            <div style="font-weight: bold; color: #ececec; margin-bottom: 5px;">Cronologia</div>
            <div>Hellis AI Attiva</div>
            <div>Sessione Privata</div>
        </div>
        <div class="sidebar-footer">
            <div class="avatar user" style="width: 24px; height: 24px; font-size: 10px;">L</div>
            <span>Lorenzo (Signore)</span>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Top bar -->
        <div class="top-bar">
            <div class="model-title">
                Hellis AI <span style="color: #8e8ea0; font-weight: normal; font-size: 14px;">▼</span>
                <span id="statoVoce"></span>
            </div>
            <button class="btn-call" onclick="avviaChiamata()">
                📞 Avvia Chiamata Vocale
            </button>
        </div>

        <!-- Chat Container -->
        <div id="chatContainer" class="chat-container">
            <div class="message-row ai">
                <div class="message-content">
                    <div class="avatar ai">H</div>
                    <div class="text">Sistemi operativi attivi, Signore. Hellis AI è online e pronto a servirvi. Come posso assistervi oggi?</div>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="input-container">
            <div class="input-box-wrapper">
                <textarea id="userInput" rows="1" placeholder="Invia un messaggio a Hellis AI..." onkeydown="handleKeyDown(event)"></textarea>
                <button class="send-btn" onclick="inviaMessaggio()">↑</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://hellis-backend1.onrender.com";

        function aggiungiMessaggio(testo, mittente) {
            const container = document.getElementById("chatContainer");
            const row = document.createElement("div");
            row.className = `message-row ${mittente}`;

            const content = document.createElement("div");
            content.className = "message-content";

            const avatar = document.createElement("div");
            avatar.className = `avatar ${mittente}`;
            avatar.innerText = mittente === "user" ? "L" : "H";

            const textDiv = document.createElement("div");
            textDiv.className = "text";
            textDiv.innerText = testo;

            content.appendChild(avatar);
            content.appendChild(textDiv);
            row.appendChild(content);
            container.appendChild(row);
            container.scrollTop = container.scrollHeight;
        }

        function parlaTesto(testo) {
            if ("speechSynthesis" in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(testo);
                utterance.lang = "it-IT";
                utterance.rate = 1.0;
                
                const voci = window.speechSynthesis.getVoices();
                const voceItaliana = voci.find(v => v.lang.includes("it") || v.lang.includes("IT"));
                if (voceItaliana) {
                    utterance.voice = voceItaliana;
                }

                window.speechSynthesis.speak(utterance);
            }
        }

        if ("speechSynthesis" in window) {
            window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
        }

        function avviaChiamata() {
            const statoEl = document.getElementById("statoVoce");
            if (!("webkitSpeechRecognition" in window) && !("SpeechRecognition" in window)) {
                alert("Il browser non supporta il riconoscimento vocale.");
                return;
            }

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = "it-IT";
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = function() {
                statoEl.innerText = "• In ascolto...";
                parlaTesto("Linea aperta, Signore. Vi ascolto.");
            };

            recognition.onresult = function(event) {
                const testoUtente = event.results[0][0].transcript;
                statoEl.innerText = "• Elaborazione...";
                aggiungiMessaggio(testoUtente, "user");
                inviaAlServer(testoUtente, true);
            };

            recognition.onerror = function(event) {
                statoEl.innerText = "• Errore voce";
            };

            recognition.onend = function() {
                setTimeout(() => {
                    if (statoEl.innerText.includes("In ascolto")) {
                        statoEl.innerText = "";
                    }
                }, 2000);
            };

            try {
                recognition.start();
            } catch (e) {
                console.error(e);
            }
        }

        async function inviaMessaggio() {
            const textarea = document.getElementById("userInput");
            const testo = textarea.value.trim();
            if (!testo) return;

            aggiungiMessaggio(testo, "user");
            textarea.value = "";
            textarea.style.height = "auto";
            await inviaAlServer(testo, false);
        }

        function handleKeyDown(e) {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                inviaMessaggio();
            }
        }

        async function inviaAlServer(testo, vocale) {
            const statoEl = document.getElementById("statoVoce");
            try {
                const res = await fetch(`${API_URL}/api/v1/chat/privata`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: testo })
                });
                const data = await res.json();
                if (data.response) {
                    aggiungiMessaggio(data.response, "ai");
                    if (vocale) {
                        statoEl.innerText = "";
                        parlaTesto(data.response);
                    }
                }
            } catch (err) {
                const errMsg = "Errore di connessione al server.";
                aggiungiMessaggio(errMsg, "ai");
                if (vocale) parlaTesto(errMsg);
            }
        }
    </script>
</body>
</html>
