<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hellis // Neural Cloud Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-[#050b14] text-slate-100 h-screen flex overflow-hidden font-sans">

    <aside class="w-80 bg-[#0f172a]/90 border-r border-cyan-500/20 flex flex-col p-4 backdrop-blur-md hidden md:flex">
        <div class="flex items-center justify-between mb-6">
            <h1 class="text-cyan-400 font-bold tracking-wider text-lg">🧠 ULTRON // HUD</h1>
        </div>
        <button onclick="nuovaChat()" class="w-full bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-semibold py-2.5 px-4 rounded-xl shadow-lg shadow-cyan-500/20 transition-all mb-4">
            ➕ Nuova Conversazione
        </button>
        <div class="text-xs text-slate-400 uppercase tracking-wider mb-2 font-semibold">Cronologia Chat</div>
        <div id="lista-chat" class="flex-1 overflow-y-auto space-y-1 pr-1"></div>
        <div class="border-t border-slate-800 pt-3 text-xs text-slate-400 flex items-center justify-between">
            <span>Stato: <strong class="text-emerald-400">Online</strong></span>
            <span class="text-[10px] bg-cyan-950 text-cyan-300 px-2 py-0.5 rounded border border-cyan-800">Signore</span>
        </div>
    </aside>

    <main class="flex-1 flex flex-col bg-[#0b1329]/60 backdrop-blur-sm">
        <header class="h-16 border-b border-cyan-500/20 flex items-center justify-between px-6 bg-[#0f172a]/40">
            <div class="flex items-center space-x-3">
                <span class="inline-block w-3 h-3 bg-cyan-400 rounded-full animate-pulse shadow-[0_0_10px_#22d3ee]"></span>
                <span class="font-bold text-slate-200 tracking-wide">HELLIS AI // Linea Privata del Signore</span>
            </div>
            <div class="text-sm text-cyan-300 font-mono bg-cyan-950/60 px-3 py-1 rounded-lg border border-cyan-800/50">
                🔒 Accesso Privato & Strumenti Attivi
            </div>
        </header>

        <div id="chat-container" class="flex-1 overflow-y-auto p-6 space-y-6">
            <div class="flex items-start space-x-4">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-cyan-500 to-blue-600 flex items-center justify-center font-bold text-white shadow-lg">H</div>
                <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-4 max-w-2xl shadow-xl text-slate-200">
                    Sistemi audio e gestione file ripristinati con successo, Signore. Come posso assisterla?
                </div>
            </div>
        </div>

        <div class="p-4 bg-[#0f172a]/60 border-t border-cyan-500/20">
            <div class="max-w-4xl mx-auto flex items-center space-x-3 bg-slate-900/90 border border-slate-700/80 rounded-2xl p-3 shadow-2xl focus-within:border-cyan-500 transition-all">
                <input type="password" id="api-token" value="hellis-secret-lord-token-2026" class="hidden">
                
                <!-- Pulsante Allega File -->
                <label class="cursor-pointer p-2 text-slate-400 hover:text-cyan-400 transition-colors" title="Allega File">
                    📎
                    <input type="file" id="file-input" class="hidden" onchange="gestisciFile(this)">
                </label>

                <!-- Pulsante Registrazione Audio -->
                <button id="mic-btn" onclick="toggleRegistrazione()" class="p-2 text-slate-400 hover:text-cyan-400 transition-colors" title="Registra Audio">
                    🎙️
                </button>

                <textarea id="user-input" rows="1" placeholder="Scrivi un messaggio a Ultron, allega un file o usa la voce..." class="flex-1 bg-transparent text-slate-100 placeholder-slate-500 px-3 py-2 resize-none outline-none max-h-32"></textarea>
                
                <button onclick="inviaMessaggio()" class="bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-medium px-5 py-2.5 rounded-xl shadow-lg transition-all">
                    Invia
                </button>
            </div>
            <div id="file-status" class="max-w-4xl mx-auto mt-2 text-xs text-cyan-400 px-2"></div>
        </div>
    </main>

    <script>
        const API_URL = "https://hellis-backend1.onrender.com";
        let chatAttiva = "Nuova Conversazione";
        let fileSelezionato = null;
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;

        function gestisciFile(input) {
            if (input.files && input.files[0]) {
                fileSelezionato = input.files[0];
                document.getElementById('file-status').innerText = `📎 File pronto: ${fileSelezionato.name}`;
            }
        }

        async function toggleRegistrazione() {
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = async () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        fileSelezionato = new File([audioBlob], "registrazione_vocale.webm", { type: 'audio/webm' });
                        document.getElementById('file-status').innerText = `🎙️ Audio registrato e pronto per l'invio.`;
                    };
                    mediaRecorder.start();
                    isRecording = true;
                    document.getElementById('mic-btn').classList.add('text-red-500', 'animate-pulse');
                    document.getElementById('file-status').innerText = "🔴 Registrazione in corso...";
                } catch (e) {
                    alert("Impossibile accedere al microfono.");
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                document.getElementById('mic-btn').classList.remove('text-red-500', 'animate-pulse');
            }
        }

        async function inviaMessaggio() {
            const input = document.getElementById('user-input');
            const token = document.getElementById('api-token').value;
            let messaggio = input.value.trim();
            if (!messaggio && !fileSelezionato) return;

            if (fileSelezionato) {
                messaggio += ` [File allegato: ${fileSelezionato.name}]`;
            }

            input.value = '';
            const testoInviato = messaggio;
            fileSelezionato = null;
            document.getElementById('file-status').innerText = '';
            aggiungiMessaggioUI("Signore", testoInviato, true);

            try {
                const res = await fetch(`${API_URL}/api/v1/chat/privata`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Hellis-Token': token
                    },
                    body: JSON.stringify({ message: testoInviato, chat_name: chatAttiva })
                });
                const data = await res.json();
                if (data.response) {
                    chatAttiva = data.chat_name;
                    aggiungiMessaggioUI("Hellis", data.response, false);
                } else {
                    aggiungiMessaggioUI("Hellis", "Errore di risposta da Ultron.", false);
                }
            } catch (e) {
                aggiungiMessaggioUI("Hellis", "Errore di connessione al server.", false);
            }
        }

        function aggiungiMessaggioUI(mittente, testo, isUtente) {
            const container = document.getElementById('chat-container');
            const row = document.createElement('div');
            row.className = `flex items-start space-x-4 ${isUtente ? 'flex-row-reverse space-x-reverse' : ''}`;
            
            const avatar = document.createElement('div');
            avatar.className = `w-9 h-9 rounded-xl flex items-center justify-center font-bold text-white shadow-lg ${isUtente ? 'bg-gradient-to-br from-purple-600 to-indigo-600' : 'bg-gradient-to-br from-cyan-500 to-blue-600'}`;
            avatar.innerText = isUtente ? 'S' : 'H';

            const bubble = document.createElement('div');
            bubble.className = `rounded-2xl p-4 max-w-2xl shadow-xl text-slate-200 ${isUtente ? 'bg-indigo-950/60 border border-indigo-500/30' : 'bg-slate-800/80 border border-slate-700/60'}`;
            bubble.innerHTML = marked.parse(testo);

            row.appendChild(avatar);
            row.appendChild(bubble);
            container.appendChild(row);
            container.scrollTop = container.scrollHeight;
        }

        function nuovaChat() {
            chatAttiva = "Nuova Conversazione";
            document.getElementById('chat-container').innerHTML = `
                <div class="flex items-start space-x-4">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-cyan-500 to-blue-600 flex items-center justify-center font-bold text-white shadow-lg">H</div>
                    <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-4 max-w-2xl shadow-xl text-slate-200">
                        Nuova sessione avviata, Signore.
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
